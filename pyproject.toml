[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wbsignin"
version = "0.2.0"
description = "WorkBuddy, Doubao & Qoder (CN/Intl) multi-account daily check-in and quota dashboard, zero dependencies"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "wbsignin contributors" }]
keywords = ["workbuddy", "doubao", "qoder", "checkin", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/3571949306/wbsignin"
Repository = "https://github.com/3571949306/wbsignin"
Issues = "https://github.com/3571949306/wbsignin/issues"

[project.scripts]
wbsignin = "wbsignin.cli:main"

[tool.setuptools]
packages = ["wbsignin"]

[tool.setuptools.package-data]
wbsignin = ["static/*.html"]
