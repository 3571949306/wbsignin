<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wbsignin · 签到控制台</title>
<style>
  :root {
    --bg: #101014; --panel: #17171c; --panel-2: #1e1e25;
    --border: #2a2a33; --text: #e6e6eb; --muted: #9a9aa5;
    --accent: #4f7cff; --accent-2: #3b5fd9;
    --ok: #3fb96f; --warn: #e0a63c; --bad: #e5534b;
    --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  h1 .dot { color: var(--accent); }
  .sub { color: var(--muted); font-size: 12px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 20px 0; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 22px; font-weight: 650; margin-top: 2px; }
  .card .v.ok { color: var(--ok); } .card .v.warn { color: var(--warn); } .card .v.bad { color: var(--bad); }

  .toolbar { display: flex; gap: 10px; margin: 18px 0; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 14px; cursor: pointer; transition: .15s;
  }
  button:hover { background: var(--accent-2); }
  button.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button.ghost:hover { border-color: var(--accent); }
  button.danger { background: transparent; color: var(--bad); border: 1px solid transparent; }
  button.danger:hover { border-color: var(--bad); background: rgba(229,83,75,.08); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .spin { display:inline-block; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 18px; }
  .panel h2 { font-size: 13px; color: var(--muted); margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; white-space: nowrap; }
  .tag.ok { background: rgba(63,185,111,.14); color: var(--ok); }
  .tag.bad { background: rgba(229,83,75,.14); color: var(--bad); }
  .tag.warn { background: rgba(224,166,60,.14); color: var(--warn); }
  .tag.blue { background: rgba(79,124,255,.14); color: #9db6ff; }
  .muted { color: var(--muted); }
  .empty { padding: 32px 16px; text-align: center; color: var(--muted); }

  #result { display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-top: 16px; }
  #result.show { display: block; }
  #result h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .res { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; font-size: 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .res:last-child { border-bottom: none; }
  .res b { font-family: var(--mono); font-weight: 600; }

  .log { background: #0c0c10; font-family: var(--mono); font-size: 12px; padding: 12px 16px; max-height: 220px; overflow-y: auto; }
  .log .line { white-space: pre-wrap; }
  .log .t { color: var(--muted); margin-right: 8px; }

  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 12px; width: 360px; max-width: 92vw; padding: 22px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h3 { margin: 0 0 14px; font-size: 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
          border-radius: 8px; padding: 9px 12px; font-size: 14px; }
  input:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  .err { color: var(--bad); font-size: 12px; margin-top: 10px; min-height: 16px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>wbsignin <span class="dot">·</span> 签到控制台</h1>
      <div class="sub">WorkBuddy · 豆包 · Qoder 多账号自动签到 · 仅本机可访问 · 时区 Asia/Shanghai</div>
    </div>
    <div class="sub" id="server-time">--</div>
  </header>

  <div class="cards">
    <div class="card"><div class="k">账号数</div><div class="v" id="c-count">–</div></div>
    <div class="card"><div class="k">下次自动签到</div><div class="v" id="c-next">–</div></div>
    <div class="card"><div class="k">凭据库锁</div><div class="v" id="c-lock">–</div></div>
  </div>

  <div class="toolbar">
    <button id="btn-signin">立即签到</button>
    <button id="btn-credit" class="ghost">刷新余额</button>
    <button id="btn-add" class="ghost">＋ 添加账号</button>
    <button id="btn-add-db" class="ghost">＋ 添加豆包</button>
    <button id="btn-add-qoder" class="ghost">＋ 添加 Qoder</button>
  </div>

  <div id="result"></div>

  <div class="panel">
    <h2>账号</h2>
    <div id="acct-body"><div class="empty">加载中…</div></div>
  </div>

  <div class="panel">
    <h2>运行日志</h2>
    <div class="log" id="log"><div class="line muted">等待操作…</div></div>
  </div>
</div>

<dialog id="add-dlg">
  <h3>添加账号（短信登录）</h3>
  <label>手机号</label>
  <input id="in-phone" inputmode="numeric" placeholder="13800000000">
  <label>验证码</label>
  <div class="row">
    <input id="in-code" inputmode="numeric" placeholder="6 位验证码">
    <button id="btn-sms" class="ghost" style="white-space:nowrap">发送验证码</button>
  </div>
  <div class="err" id="add-err"></div>
  <div class="modal-foot">
    <button id="btn-cancel" class="ghost">取消</button>
    <button id="btn-confirm">确认登录</button>
  </div>
</dialog>

<dialog id="add-db-dlg">
  <h3>添加豆包账号（粘贴 Cookie）</h3>
  <label>账号名称（用于区分，如「豆包主号」）</label>
  <input id="in-db-name" placeholder="豆包主号">
  <label>doubao.com 会话 Cookie</label>
  <textarea id="in-db-cookie" rows="4" placeholder="浏览器打开 doubao.com 并登录后，F12 → Network → 任意请求 → 复制 Cookie 请求头的值" style="width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px;font-size:13px;resize:vertical"></textarea>
  <div class="hint">仅个人账号有「每日签到」；工作版/飞书企业账号无此玩法。</div>
  <div class="err" id="add-db-err"></div>
  <div class="modal-foot">
    <button id="btn-db-cancel" class="ghost">取消</button>
    <button id="btn-db-confirm">确认添加</button>
  </div>
</dialog>

<dialog id="add-qoder-dlg">
  <h3>添加 Qoder 账号（国内版 / 国际版）</h3>
  <label>版本</label>
  <select id="in-qoder-region" style="width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px;font-size:13px">
    <option value="cn">国内版（openapi.qoder.com.cn）</option>
    <option value="intl">国际版（openapi.qoder.sh）</option>
  </select>
  <label>账号名称（可选，如「Qoder国内」）</label>
  <input id="in-qoder-name" placeholder="Qoder 主号（可选）">
  <label>Token（dt-... / pt-... PAT）或凭据 JSON</label>
  <textarea id="in-qoder-token" rows="4" placeholder="粘贴 dt-... / pt-... 或 tools/pull_qoder_cred.py --json 输出的 JSON" style="width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px;font-size:13px;resize:vertical"></textarea>
  <div class="hint">每天北京时间 10:00 刷新，每日可领 100 Credits。</div>
  <div class="err" id="add-qoder-err"></div>
  <div class="modal-foot">
    <button id="btn-qoder-cancel" class="ghost">取消</button>
    <button id="btn-qoder-confirm">确认添加</button>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const H = { 'X-Requested-With': 'wbsignin' };

async function req(path, method, body) {
  const opt = { method, headers: {} };
  if (method === 'POST') opt.headers = { 'Content-Type': 'application/json', ...H };
  if (body !== undefined) opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  const d = await r.json().catch(() => ({}));
  if (!r.ok && !d.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}
const get = p => req(p, 'GET');
const post = (p, b) => req(p, 'POST', b === undefined ? {} : b);

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderAccounts(accounts) {
  $('#c-count').textContent = accounts.length;
  const lock = accounts.locked;
  $('#c-lock').textContent = lock ? '被占用' : '空闲';
  $('#c-lock').className = 'v ' + (lock ? 'warn' : 'ok');

  const body = $('#acct-body');
  if (!accounts.length) { body.innerHTML = '<div class="empty">暂无账号，点「添加账号」登录第一个。</div>'; return; }

  const PROVIDER_BADGE = { 'doubao': '豆包', 'qoder-cn': 'Qoder国内', 'qoder': 'Qoder国际' };
  const rows = accounts.map(a => {
    const isDb = a.provider === 'doubao';
    const isQoder = a.provider === 'qoder' || a.provider === 'qoder-cn';
    let sign;
    if (a.last_error) {
      sign = `<span class="tag bad" title="${esc(a.last_error)}">异常</span>`;
    } else if (a.ok) {
      sign = `<span class="tag ok" title="${esc(a.signin)}">已签到</span>`;
    } else if (a.signin) {
      sign = `<span class="tag warn" title="${esc(a.signin)}">未签</span>`;
    } else {
      sign = `<span class="muted">–</span>`;
    }
    const badgeText = PROVIDER_BADGE[a.provider];
    const ptag = badgeText ? `<span class="tag blue" style="margin-right:6px">${esc(badgeText)}</span>` : '';
    const credit = a.credit
      ? `<span class="muted" title="${esc((a.credit.lines || []).join('\n'))}">${esc(a.credit.total)}</span>`
      : `<span class="muted">–</span>`;
    let exp = '<span class="muted">–</span>';
    if (a.expiry && a.expiry.expire) {
      const soon = a.expiry.ms && (a.expiry.ms - Date.now() < 7 * 86400000);
      const unit = isDb ? '额度' : (isQoder ? ' Credits' : '积分');
      exp = `<span class="${soon ? 'tag warn' : ''}" title="${esc(a.expiry.name)} ${esc(a.expiry.remain)}${unit}，${esc(a.expiry.expire)}到期">${esc(a.expiry.expire.slice(5))}</span>`;
    }
    const atExp = isDb ? '–' : esc(a.at_exp);
    return `<tr>
      <td>${ptag}<b style="font-family:var(--mono)">${esc(a.masked)}</b></td>
      <td>${sign}</td>
      <td>${credit}</td>
      <td>${exp}</td>
      <td class="muted">${atExp}</td>
      <td style="text-align:right"><button class="danger" data-phone="${esc(a.phone)}">移除</button></td>
    </tr>`;
  }).join('');
  body.innerHTML = `<table>
    <thead><tr><th>账号</th><th>签到状态</th><th>余额</th><th>积分到期</th><th>AT 到期</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function renderLog(lines) {
  const el = $('#log');
  el.innerHTML = lines.map(l => `<div class="line"><span class="t">${esc(l[0])}</span>${esc(l[1])}</div>`).join('') || '<div class="line muted">（空）</div>';
  el.scrollTop = el.scrollHeight;
}

// 签到结果：明确区分「本次新签到 / 今日已签到 / 失败」
function renderSigninResult(r) {
  const box = $('#result');
  const badge = s => {
    if (s === 'SIGNED') return '<span class="tag ok">新签到</span>';
    if (s === 'ALREADY') return '<span class="tag blue">已签到</span>';
    if (s === 'RETRY') return '<span class="tag warn">待重试</span>';
    return '<span class="tag bad">失败</span>';
  };
  const rows = (r.rows || []).map(x => {
    const err = x.refresh_error ? `<span class="muted">${esc(x.refresh_error)}</span>` : '';
    return `<div class="res">${badge(x.status)} <b>${esc(x.masked)}</b> <span>${esc(x.summary)}</span> ${err}</div>`;
  }).join('');
  box.innerHTML = `<h3>签到结果 · ${esc(r.one_line)}</h3>${rows}`;
  box.classList.add('show');
}

async function refresh() {
  try {
    const st = await get('/api/state');
    $('#server-time').textContent = '服务器时间 ' + st.server_time;
    $('#c-next').textContent = st.next_run ? st.next_run.slice(5) : '未启用';
    $('#c-next').title = st.next_run ? ('下次自动签到 ' + st.next_run) : '未检测到 systemd 定时器';
    renderAccounts(st.accounts);
    const lg = await get('/api/log');
    renderLog(lg.lines);
  } catch (e) { /* 静默 */ }
}

function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.txt = btn.textContent; btn.disabled = true; btn.innerHTML = '<span class="spin">⟳</span> ' + label; }
  else { btn.disabled = false; btn.textContent = btn.dataset.txt || btn.textContent; }
}

async function doSignin() {
  busy($('#btn-signin'), true, '签到中…');
  try {
    const r = await post('/api/signin');
    renderSigninResult(r);
    await refresh();
  } catch (e) { alert('签到失败：' + e.message); }
  finally { busy($('#btn-signin'), false); }
}

async function doCredit() {
  busy($('#btn-credit'), true, '刷新中…');
  try { await post('/api/credit'); await refresh(); }
  catch (e) { alert('刷新失败：' + e.message); }
  finally { busy($('#btn-credit'), false); }
}

$('#btn-signin').onclick = doSignin;
$('#btn-credit').onclick = doCredit;

// ---- 添加账号 ----
const dlg = $('#add-dlg');
$('#btn-add').onclick = () => { $('#add-err').textContent = ''; dlg.showModal(); };
$('#btn-cancel').onclick = () => dlg.close();

$('#btn-sms').onclick = async () => {
  const phone = $('#in-phone').value.trim();
  $('#add-err').textContent = '';
  if (!/^1\d{10}$/.test(phone)) { $('#add-err').textContent = '请输入 11 位手机号'; return; }
  busy($('#btn-sms'), true, '发送中…');
  try { const r = await post('/api/sms', { phone }); $('#add-err').textContent = '验证码已发送（' + r.expires_in + ' 秒内有效）'; }
  catch (e) { $('#add-err').textContent = '发送失败：' + e.message; }
  finally { busy($('#btn-sms'), false); }
};

$('#btn-confirm').onclick = async () => {
  const phone = $('#in-phone').value.trim();
  const code = $('#in-code').value.trim();
  $('#add-err').textContent = '';
  if (!phone || !code) { $('#add-err').textContent = '请填写手机号和验证码'; return; }
  busy($('#btn-confirm'), true, '登录中…');
  try {
    await post('/api/login', { phone, code });
    dlg.close(); $('#in-code').value = '';
    await refresh();
  } catch (e) { $('#add-err').textContent = '登录失败：' + e.message; }
  finally { busy($('#btn-confirm'), false); }
};

// ---- 添加豆包 ----
const dbDlg = $('#add-db-dlg');
$('#btn-add-db').onclick = () => { $('#add-db-err').textContent = ''; dbDlg.showModal(); };
$('#btn-db-cancel').onclick = () => dbDlg.close();

$('#btn-db-confirm').onclick = async () => {
  const name = $('#in-db-name').value.trim();
  const cookie = $('#in-db-cookie').value.trim();
  $('#add-db-err').textContent = '';
  if (!cookie) { $('#add-db-err').textContent = '请粘贴 Cookie'; return; }
  busy($('#btn-db-confirm'), true, '校验中…');
  try {
    await post('/api/login-doubao', { cookie, name });
    dbDlg.close(); $('#in-db-cookie').value = '';
    await refresh();
  } catch (e) { $('#add-db-err').textContent = '添加失败：' + e.message; }
  finally { busy($('#btn-db-confirm'), false); }
};

// ---- 添加 Qoder ----
const qoderDlg = $('#add-qoder-dlg');
$('#btn-add-qoder').onclick = () => { $('#add-qoder-err').textContent = ''; qoderDlg.showModal(); };
$('#btn-qoder-cancel').onclick = () => qoderDlg.close();

$('#btn-qoder-confirm').onclick = async () => {
  const region = $('#in-qoder-region').value;
  const name = $('#in-qoder-name').value.trim();
  const token = $('#in-qoder-token').value.trim();
  $('#add-qoder-err').textContent = '';
  if (!token) { $('#add-qoder-err').textContent = '请粘贴 Token 或凭据 JSON'; return; }
  busy($('#btn-qoder-confirm'), true, '校验中…');
  try {
    await post('/api/login-qoder', { region, name, token });
    qoderDlg.close(); $('#in-qoder-token').value = '';
    await refresh();
  } catch (e) { $('#add-qoder-err').textContent = '添加失败：' + e.message; }
  finally { busy($('#btn-qoder-confirm'), false); }
};

// ---- 移除账号 ----
document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-phone]');
  if (!b) return;
  const phone = b.dataset.phone;
  if (!confirm('确认移除账号 ' + phone + ' ？凭据将一并删除。')) return;
  try { await post('/api/remove', { phone }); await refresh(); }
  catch (err) { alert('移除失败：' + err.message); }
});

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
